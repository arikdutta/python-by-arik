<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Todo App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 40px 16px; }
    .card { background: #fff; border-radius: 10px; padding: 28px; width: 100%; max-width: 480px; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
    h1 { font-size: 1.5rem; margin-bottom: 20px; color: #1a1a2e; }
    .add-row { display: flex; gap: 8px; margin-bottom: 20px; }
    .add-row input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; outline: none; }
    .add-row input:focus { border-color: #5c6bc0; }
    .add-row button { padding: 10px 18px; background: #5c6bc0; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .add-row button:hover { background: #3949ab; }
    ul { list-style: none; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    li:last-child { border-bottom: none; }
    li span { flex: 1; font-size: .95rem; color: #333; cursor: pointer; }
    li.done span { text-decoration: line-through; color: #aaa; }
    .del { background: none; border: none; color: #e53935; font-size: 1.1rem; cursor: pointer; }
    .del:hover { color: #b71c1c; }
    .empty { color: #aaa; font-size: .9rem; text-align: center; padding: 20px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>To-Do List</h1>
    <div class="add-row">
      <input id="input" type="text" placeholder="Add a task..." />
      <button onclick="addTodo()">Add</button>
    </div>
    <ul id="list"></ul>
    <p id="empty" class="empty" style="display:none">No tasks yet. Add one above!</p>
  </div>

  <script>
    const API = "/api/todos";

    async function load() {
      const res = await fetch(API);
      const todos = await res.json();
      render(todos);
    }

    function render(todos) {
      const list = document.getElementById("list");
      const empty = document.getElementById("empty");
      list.innerHTML = "";
      if (!todos.length) { empty.style.display = "block"; return; }
      empty.style.display = "none";
      todos.forEach(t => {
        const li = document.createElement("li");
        if (t.done) li.classList.add("done");
        li.innerHTML = `
          <span onclick="toggle(${t.id})">${escHtml(t.text)}</span>
          <button class="del" onclick="del(${t.id})">&#x2715;</button>`;
        list.appendChild(li);
      });
    }

    async function addTodo() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;
      await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      input.value = "";
      load();
    }

    async function toggle(id) {
      await fetch(`${API}/${id}`, { method: "PATCH" });
      load();
    }

    async function del(id) {
      await fetch(`${API}/${id}`, { method: "DELETE" });
      load();
    }

    function escHtml(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    document.getElementById("input").addEventListener("keydown", e => {
      if (e.key === "Enter") addTodo();
    });

    load();
  </script>
</body>
</html>
